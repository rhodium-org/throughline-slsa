uid: SR-0013
type: system_requirement
status: approved
title: Repositories are uniquely identifiable
text: The SCS defines a repository ID that is uniquely identifiable within the SCS via a stable
  locator, such as a URI.
rationale: A stable, unique repository identifier lets attestations and consumers refer to
  exactly one source repository.

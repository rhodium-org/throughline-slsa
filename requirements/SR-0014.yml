uid: SR-0014
type: system_requirement
status: approved
title: Revisions are immutable and uniquely identifiable
text: The SCS defines a revision ID that is uniquely identifiable within the repository; where
  the revision ID is not a content digest, the SCS documents how the revision's immutability
  is established.
rationale: An immutable, unique revision identifier guarantees that a reference always resolves
  to identical source content.

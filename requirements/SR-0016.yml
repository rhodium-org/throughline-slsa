uid: SR-0016
type: system_requirement
status: approved
title: Source Verification Summary Attestations
text: The SCS generates a Source Verification Summary Attestation (VSA) indicating the SLSA
  Source level of any revision at Level 1 or above, and makes it fetchable by any consumer
  authorized to access the revision.
rationale: A VSA communicates a revision's source level to consumers in a standard, verifiable
  form; absence of a VSA means Source Level 0.

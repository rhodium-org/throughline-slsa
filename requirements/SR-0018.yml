uid: SR-0018
type: system_requirement
status: approved
title: Continuity
text: For each technical control claimed in a VSA, the SCS establishes and tracks continuity
  from a specific start revision, re-establishing it from a new revision after any lapse,
  with exceptions only via the safe expunging process.
rationale: Continuity demonstrates that a claimed control has been enforced without gaps,
  not just at a single point in time.

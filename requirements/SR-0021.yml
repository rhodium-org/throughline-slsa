uid: SR-0021
type: system_requirement
status: approved
title: Protected Named References
text: The SCS lets an organization enforce customized technical controls for named references,
  indicate which references are protected, and records the controls enforced on them in contemporaneously
  produced attestations associated with the corresponding revisions.
rationale: Marking branches as protected and recording the controls enforced on them produces
  the evidence higher-level consumers rely on.
